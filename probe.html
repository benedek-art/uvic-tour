<!doctype html><html><head><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0;height:100%}#m{position:absolute;inset:0}</style></head>
<body><div id="m"></div>
<script type="module">
import * as maplibregl from 'maplibre-gl'
import buildings from './src/data/generated/buildings.geojson'
import paths from './src/data/generated/paths.geojson'
const log = (...a) => console.log('PROBE', ...a)
const fired = []
const style = {
  version: 8,
  sources: { buildings: { type:'geojson', data: buildings }, paths: { type:'geojson', data: paths } },
  layers: [
    { id:'background', type:'background', paint:{ 'background-color':'#05070E' } },
    { id:'paths', type:'line', source:'paths', paint:{ 'line-color':'#1E2E4D','line-width':1.1 } },
    { id:'b3d', type:'fill-extrusion', source:'buildings',
      paint:{ 'fill-extrusion-color':'#18213A','fill-extrusion-height':['get','height'] } },
  ],
}
const map = new maplibregl.Map({ container:'m', style, center:[-123.3117,48.4634], zoom:14.4, pitch:50, attributionControl:false })
for (const ev of ['load','idle','styledata','sourcedata','error','render']) {
  map.on(ev, (e) => { if (!fired.includes(ev)) { fired.push(ev); log('event:', ev, ev==='error' ? String(e.error) : '') } })
}
setTimeout(() => log('RESULT fired=', JSON.stringify(fired), 'loaded=', map.loaded(), 'styleLoaded=', map.isStyleLoaded(),
  'srcBuildings=', map.isSourceLoaded('buildings'), 'srcPaths=', map.isSourceLoaded('paths')), 6000)
</script></body></html>
