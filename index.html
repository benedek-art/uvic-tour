<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>UVic Tour</title>
<meta name="description" content="Your Fall 2026 campus map — classes, routes, and the good spots." />
<meta name="theme-color" content="#05070E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="UVic Tour" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<!-- Fonts are self-hosted (see src/fonts.css). There is deliberately NO external
     font-CDN request here: this app has to work on campus with no signal, and a
     remote stylesheet would be the one thing that fails offline.
     Preloaded because both faces are used above the fold by the boot screen. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin-var.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin-var.woff2" crossorigin />
</head>
<body>
  <div id="app">
    <div id="map" aria-label="3D map of the University of Victoria campus"></div>
    <div id="boot" role="status"><div class="boot-mark"></div><p>Lighting up campus…</p></div>
    <main id="sheet" data-testid="bottom-sheet" hidden></main>
    <div id="scrubber" hidden></div>
    <div id="topbar" hidden></div>
    <div id="tour-overlay" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
